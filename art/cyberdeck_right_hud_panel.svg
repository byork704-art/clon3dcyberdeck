<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <!-- Right panel HUD overlay -->
  
  <!-- Main HUD frame -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#00d9ff" stroke-width="2" opacity="0.6"/>
  
  <!-- Divider line -->
  <line x1="30" y1="80" x2="370" y2="80" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
  
  <!-- HUD header -->
  <text x="200" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00d9ff" text-anchor="middle">SYSTEM DATA</text>
  
  <!-- System info blocks -->
  <g opacity="0.6">
    <!-- Block 1 -->
    <rect x="35" y="100" width="150" height="100" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
    <text x="45" y="125" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" opacity="0.7">PLATFORM</text>
    <text x="45" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00d9ff">RETRO</text>
    <text x="45" y="170" font-family="Arial, sans-serif" font-size="9" fill="#00d9ff" opacity="0.5">Emulation Ready</text>
    
    <!-- Block 2 -->
    <rect x="215" y="100" width="150" height="100" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
    <text x="225" y="125" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" opacity="0.7">STATUS</text>
    <text x="225" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00d9ff">READY</text>
    <text x="225" y="170" font-family="Arial, sans-serif" font-size="9" fill="#00d9ff" opacity="0.5">Online</text>
  </g>
  
  <!-- Middle divider -->
  <line x1="30" y1="230" x2="370" y2="230" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
  
  <!-- Control hints -->
  <g opacity="0.5">
    <text x="200" y="270" font-family="Arial, sans-serif" font-size="10" fill="#00d9ff" text-anchor="middle">NAVIGATION</text>
    <text x="200" y="295" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.6" text-anchor="middle">Arrow Keys / D-Pad</text>
    <text x="200" y="320" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" opacity="0.6" text-anchor="middle">Enter / A Button</text>
  </g>
  
  <!-- Bottom accent -->
  <g opacity="0.4">
    <line x1="30" y1="510" x2="370" y2="510" stroke="#00d9ff" stroke-width="1"/>
    <text x="200" y="545" font-family="Arial, sans-serif" font-size="8" fill="#00d9ff" text-anchor="middle" opacity="0.5">v1.0 TACTICAL INTERFACE</text>
  </g>
</svg>