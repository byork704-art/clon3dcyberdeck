<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 150">
  <!-- Dark Background -->
  <rect width="1920" height="150" fill="#0d0d0f"/>
  
  <!-- Top Accent Line -->
  <rect width="1920" height="2" fill="#00d9ff" opacity="0.8"/>
  
  <!-- Secondary Accent Line -->
  <rect y="40" width="1920" height="1" fill="#00d9ff" opacity="0.3"/>
  
  <!-- Left Section - Branding -->
  <g opacity="0.6">
    <text x="40" y="90" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#00d9ff">CLON3D</text>
    <text x="40" y="120" font-family="Arial, sans-serif" font-size="12" fill="#00d9ff" opacity="0.7">CYBERDECK</text>
  </g>
  
  <!-- Center - System Type Placeholder -->
  <g opacity="0.5">
    <text x="960" y="90" font-family="Arial, sans-serif" font-size="16" fill="#00d9ff" text-anchor="middle" font-style="italic">SYSTEM INTERFACE</text>
  </g>
  
  <!-- Right Section - Status Indicators -->
  <g opacity="0.6">
    <circle cx="1840" cy="75" r="8" fill="none" stroke="#00d9ff" stroke-width="1.5"/>
    <circle cx="1840" cy="75" r="4" fill="#00d9ff" opacity="0.7"/>
    <text x="1760" y="95" font-family="Arial, sans-serif" font-size="12" fill="#00d9ff" text-anchor="end">ONLINE</text>
  </g>
  
  <!-- Bottom Accent Line -->
  <rect y="148" width="1920" height="2" fill="#00d9ff" opacity="0.8"/>
</svg>
