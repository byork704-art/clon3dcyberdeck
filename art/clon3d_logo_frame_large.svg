<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <!-- Large left-side system logo presentation frame -->
  <!-- This is where the system logo will be displayed -->
  
  <!-- Outer frame (industrial metal) -->
  <rect x="20" y="20" width="760" height="860" fill="none" stroke="#00d9ff" stroke-width="2" opacity="0.7"/>
  
  <!-- Inner frame (precision) -->
  <rect x="40" y="40" width="720" height="820" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
  
  <!-- Left edge bright line (aluminum edge) -->
  <rect x="15" y="15" width="2" height="870" fill="#00d9ff" opacity="0.5"/>
  
  <!-- Top edge bright line -->
  <rect x="15" y="15" width="770" height="2" fill="#00d9ff" opacity="0.5"/>
  
  <!-- Corner accent circles -->
  <circle cx="30" cy="30" r="6" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="770" cy="30" r="6" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="30" cy="870" r="6" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="770" cy="870" r="6" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Center alignment crosshair (subtle) -->
  <g stroke="#00d9ff" stroke-width="1" opacity="0.2">
    <line x1="400" y1="380" x2="400" y2="420"/>
    <line x1="380" y1="400" x2="420" y2="400"/>
  </g>
</svg>