<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <!-- Left panel frame for system logo -->
  
  <!-- Outer frame border -->
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#00d9ff" stroke-width="2" opacity="0.6"/>
  
  <!-- Inner frame -->
  <rect x="40" y="40" width="320" height="520" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
  
  <!-- Corner brackets -->
  <g stroke="#00d9ff" stroke-width="2" fill="none" opacity="0.8">
    <!-- Top left -->
    <path d="M 30 30 L 30 70 M 30 30 L 70 30"/>
    <!-- Top right -->
    <path d="M 370 30 L 370 70 M 370 30 L 330 30"/>
    <!-- Bottom left -->
    <path d="M 30 570 L 30 530 M 30 570 L 70 570"/>
    <!-- Bottom right -->
    <path d="M 370 570 L 370 530 M 370 570 L 330 570"/>
  </g>
  
  <!-- Center crosshair indicator -->
  <g opacity="0.4">
    <line x1="200" y1="200" x2="200" y2="250" stroke="#00d9ff" stroke-width="1"/>
    <line x1="175" y1="225" x2="225" y2="225" stroke="#00d9ff" stroke-width="1"/>
    <circle cx="200" cy="225" r="8" fill="none" stroke="#00d9ff" stroke-width="1"/>
  </g>
</svg>