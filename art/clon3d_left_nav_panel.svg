<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 907">
  <!-- CLON3D CYBERDECK OS - Left Navigation Panel -->
  <!-- Background -->
  <rect width="268" height="907" fill="#000000" opacity="0.55"/>
  <!-- Border -->
  <rect x="1" y="1" width="266" height="905" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.5"/>
  <!-- Right-edge accent line -->
  <line x1="265" y1="0" x2="265" y2="907" stroke="#00d9ff" stroke-width="3" opacity="0.7"/>

  <!-- Corner brackets -->
  <g stroke="#00d9ff" stroke-width="2" fill="none" opacity="0.8">
    <!-- Top-left -->
    <polyline points="10,40 10,10 40,10"/>
    <!-- Top-right -->
    <polyline points="228,10 258,10 258,40"/>
    <!-- Bottom-left -->
    <polyline points="10,867 10,897 40,897"/>
    <!-- Bottom-right -->
    <polyline points="228,897 258,897 258,867"/>
  </g>

  <!-- Section header -->
  <text x="134" y="65" font-family="monospace" font-size="9" fill="#00d9ff" opacity="0.5" text-anchor="middle">NAVIGATION</text>
  <line x1="20" y1="75" x2="248" y2="75" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>

  <!-- 6 Navigation diamonds stacked vertically -->
  <!-- Diamond 1 (inactive) y=140 -->
  <polygon points="134,120 154,140 134,160 114,140" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.3"/>
  <text x="134" y="185" font-family="monospace" font-size="8" fill="#00d9ff" opacity="0.25" text-anchor="middle">01</text>

  <!-- Diamond 2 (active - filled) y=246 -->
  <polygon points="134,226 154,246 134,266 114,246" fill="#00d9ff" opacity="0.9"/>
  <polygon points="134,226 154,246 134,266 114,246" fill="none" stroke="#00d9ff" stroke-width="2" opacity="1"/>
  <text x="134" y="291" font-family="monospace" font-size="8" fill="#00d9ff" opacity="0.8" text-anchor="middle">02</text>

  <!-- Diamond 3 (inactive) y=352 -->
  <polygon points="134,332 154,352 134,372 114,352" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.3"/>
  <text x="134" y="397" font-family="monospace" font-size="8" fill="#00d9ff" opacity="0.25" text-anchor="middle">03</text>

  <!-- Diamond 4 (inactive) y=458 -->
  <polygon points="134,438 154,458 134,478 114,458" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.3"/>
  <text x="134" y="503" font-family="monospace" font-size="8" fill="#00d9ff" opacity="0.25" text-anchor="middle">04</text>

  <!-- Diamond 5 (inactive) y=564 -->
  <polygon points="134,544 154,564 134,584 114,564" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.3"/>
  <text x="134" y="609" font-family="monospace" font-size="8" fill="#00d9ff" opacity="0.25" text-anchor="middle">05</text>

  <!-- Diamond 6 (inactive) y=670 -->
  <polygon points="134,650 154,670 134,690 114,670" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.3"/>
  <text x="134" y="715" font-family="monospace" font-size="8" fill="#00d9ff" opacity="0.25" text-anchor="middle">06</text>

  <!-- Bottom divider and label -->
  <line x1="20" y1="820" x2="248" y2="820" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>
  <text x="134" y="845" font-family="monospace" font-size="9" fill="#00d9ff" opacity="0.4" text-anchor="middle">NAV INDEX</text>
</svg>
