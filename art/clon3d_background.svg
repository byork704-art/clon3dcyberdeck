<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Full Dark Gunmetal Background -->
  <rect width="1920" height="1080" fill="#1a1a1e"/>
  
  <!-- Subtle Tech Grid Pattern -->
  <defs>
    <pattern id="techgrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none" stroke="#00d9ff" stroke-width="0.5" opacity="0.06"/>
      <circle cx="30" cy="30" r="1" fill="#00d9ff" opacity="0.1"/>
    </pattern>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#techgrid)"/>
  
  <!-- Subtle Horizontal Scanning Lines -->
  <defs>
    <pattern id="scanlines" width="1920" height="2" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="1920" y2="0" stroke="#00d9ff" stroke-width="0.5" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#scanlines)"/>
  
  <!-- Vignette Effect (Dark Edges) -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#1a1a1e;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
