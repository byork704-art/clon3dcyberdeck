<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 864">
  <!-- CLON3D CYBERDECK OS - Asymmetric Logo Frame -->
  <!-- Chamfered top-left corner (industrial 45deg cut, 60px) -->

  <!-- Outer frame: chamfered top-left -->
  <path d="M 60,3 L 1149,3 L 1149,861 L 3,861 L 3,60 Z"
        fill="none" stroke="#00d9ff" stroke-width="3" opacity="0.9"/>

  <!-- Chamfer diagonal accent: top-left cut -->
  <line x1="3" y1="60" x2="60" y2="3" stroke="#00d9ff" stroke-width="3" opacity="0.9"/>

  <!-- Inner frame: same chamfered shape, slightly inset -->
  <path d="M 80,18 L 1134,18 L 1134,846 L 18,846 L 18,80 Z"
        fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>

  <!-- Right-angle bracket accents: top-right corner -->
  <g stroke="#00d9ff" stroke-width="2" fill="none" opacity="0.8">
    <polyline points="1069,3 1149,3 1149,83"/>
  </g>

  <!-- Right-angle bracket accents: bottom-left corner -->
  <g stroke="#00d9ff" stroke-width="2" fill="none" opacity="0.8">
    <polyline points="3,781 3,861 83,861"/>
  </g>

  <!-- Right-angle bracket accents: bottom-right corner -->
  <g stroke="#00d9ff" stroke-width="2" fill="none" opacity="0.8">
    <polyline points="1069,861 1149,861 1149,781"/>
  </g>

  <!-- Chamfer corner accent (top-left area bracket) -->
  <g stroke="#00d9ff" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="3" y1="60" x2="3" y2="130"/>
    <line x1="60" y1="3" x2="130" y2="3"/>
  </g>

  <!-- Subtle center crosshair at (576, 432) -->
  <g stroke="#00d9ff" stroke-width="1" opacity="0.2">
    <line x1="561" y1="432" x2="591" y2="432"/>
    <line x1="576" y1="417" x2="576" y2="447"/>
    <circle cx="576" cy="432" r="12" fill="none"/>
  </g>

  <!-- Thin horizontal divider at 82% height (~708px): system name zone separator -->
  <line x1="20" y1="708" x2="1132" y2="708" stroke="#00d9ff" stroke-width="1" opacity="0.35"/>
  <!-- Small tick marks on divider -->
  <line x1="20" y1="700" x2="20" y2="716" stroke="#00d9ff" stroke-width="1" opacity="0.35"/>
  <line x1="1132" y1="700" x2="1132" y2="716" stroke="#00d9ff" stroke-width="1" opacity="0.35"/>
  <!-- Zone label -->
  <text x="576" y="738" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.35" text-anchor="middle">SYSTEM DESIGNATION</text>
</svg>
