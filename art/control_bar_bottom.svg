<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 190">
  <!-- Dark Background -->
  <rect width="1920" height="190" fill="#0d0d0f"/>
  
  <!-- Top Accent Line -->
  <rect y="0" width="1920" height="2" fill="#00d9ff" opacity="0.8"/>
  
  <!-- Left Control Section -->
  <g opacity="0.7">
    <text x="40" y="60" font-family="Arial, sans-serif" font-size="14" fill="#00d9ff" font-weight="bold">SELECT</text>
    <rect x="30" y="70" width="60" height="30" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.5"/>
    
    <text x="40" y="130" font-family="Arial, sans-serif" font-size="14" fill="#00d9ff" font-weight="bold">LAUNCH</text>
    <rect x="30" y="140" width="60" height="30" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Center - Navigation Info -->
  <g opacity="0.6" text-anchor="middle">
    <text x="960" y="50" font-family="Arial, sans-serif" font-size="12" fill="#00d9ff">NAVIGATE WITH D-PAD OR THUMBSTICK</text>
    <text x="960" y="100" font-family="Arial, sans-serif" font-size="11" fill="#00d9ff" opacity="0.7">PRESS A BUTTON TO SELECT • B TO GO BACK</text>
    <text x="960" y="145" font-family="Arial, sans-serif" font-size="11" fill="#00d9ff" opacity="0.7">SYSTEM CAROUSEL MODE</text>
  </g>
  
  <!-- Right Control Section -->
  <g opacity="0.7" text-anchor="end">
    <text x="1880" y="60" font-family="Arial, sans-serif" font-size="14" fill="#00d9ff" font-weight="bold">MENU</text>
    <rect x="1830" y="70" width="60" height="30" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.5"/>
    
    <text x="1880" y="130" font-family="Arial, sans-serif" font-size="14" fill="#00d9ff" font-weight="bold">INFO</text>
    <rect x="1830" y="140" width="60" height="30" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Bottom Accent Line -->
  <rect y="188" width="1920" height="2" fill="#00d9ff" opacity="0.8"/>
  
  <!-- Decorative Corner Elements -->
  <g stroke="#00d9ff" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 10 10 L 10 40 L 40 40"/>
    <path d="M 1910 10 L 1910 40 L 1880 40"/>
  </g>
</svg>