<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 150">
  <!-- Dark header background -->
  <rect width="1920" height="150" fill="#0d0d0f"/>
  
  <!-- Top bright line -->
  <rect width="1920" height="3" fill="#00d9ff" opacity="0.9"/>
  
  <!-- Secondary dividing line -->
  <rect y="75" width="1920" height="1" fill="#00d9ff" opacity="0.4"/>
  
  <!-- Left branding area -->
  <g opacity="0.8">
    <text x="60" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#00d9ff">CLON3D</text>
    <text x="60" y="125" font-family="Arial, sans-serif" font-size="16" fill="#00d9ff" letter-spacing="4">CYBERDECK</text>
  </g>
  
  <!-- Center: System indicator -->
  <g opacity="0.5" text-anchor="middle">
    <text x="960" y="95" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-style="italic">GAMING TERMINAL</text>
  </g>
  
  <!-- Right status area -->
  <g opacity="0.7" text-anchor="end">
    <!-- Status indicator LED -->
    <circle cx="1850" cy="50" r="6" fill="none" stroke="#00d9ff" stroke-width="1.5"/>
    <circle cx="1850" cy="50" r="3" fill="#00d9ff"/>
    
    <!-- Status label -->
    <text x="1780" y="65" font-family="Arial, sans-serif" font-size="11" fill="#00d9ff">ONLINE</text>
    
    <!-- Version info -->
    <text x="1850" y="125" font-family="Arial, sans-serif" font-size="10" fill="#00d9ff" opacity="0.6">v1.0</text>
  </g>
  
  <!-- Bottom bright line -->
  <rect y="147" width="1920" height="3" fill="#00d9ff" opacity="0.9"/>
</svg>