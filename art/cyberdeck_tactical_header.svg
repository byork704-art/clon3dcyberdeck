<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 120">
  <!-- Tactical status header bar -->
  
  <!-- Dark background with metallic edge -->
  <rect width="1920" height="120" fill="#0d0d11"/>
  <rect width="1920" height="3" fill="#00d9ff" opacity="0.8"/>
  <rect y="117" width="1920" height="3" fill="#00d9ff" opacity="0.6"/>
  
  <!-- Left section: System identifier -->
  <g>
    <!-- CLON3D branding -->
    <text x="40" y="50" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#00d9ff" letter-spacing="3">CLON3D</text>
    
    <!-- Subtext -->
    <text x="40" y="75" font-family="'Courier New', monospace" font-size="11" fill="#00d9ff" opacity="0.6" letter-spacing="2">CYBERDECK OS</text>
  </g>
  
  <!-- Center section: System status indicator -->
  <g text-anchor="middle">
    <!-- Status frame -->
    <rect x="860" y="20" width="200" height="80" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
    
    <!-- Status LED -->
    <circle cx="920" cy="40" r="5" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.6"/>
    <circle cx="920" cy="40" r="3" fill="#00d9ff" opacity="0.8"/>
    <circle cx="920" cy="40" r="2" fill="#ffffff" opacity="0.4"/>
    
    <!-- Status text -->
    <text x="920" y="65" font-family="'Courier New', monospace" font-size="13" fill="#00d9ff" font-weight="bold">READY</text>
    <text x="920" y="85" font-family="'Courier New', monospace" font-size="9" fill="#00d9ff" opacity="0.5">SYSTEM ONLINE</text>
  </g>
  
  <!-- Right section: System info -->
  <g text-anchor="end">
    <!-- Version -->
    <text x="1880" y="45" font-family="'Courier New', monospace" font-size="11" fill="#00d9ff">v2.0</text>
    
    <!-- Timestamp placeholder -->
    <text x="1880" y="80" font-family="'Courier New', monospace" font-size="10" fill="#00d9ff" opacity="0.5">EMULATION PLATFORM</text>
  </g>
</svg>