<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 86">
  <!-- CLON3D CYBERDECK OS - System Header Bar -->
  <!-- Background -->
  <rect width="1920" height="86" fill="#0a0a0e" opacity="0.95"/>
  <!-- Top border: 3px full-width -->
  <line x1="0" y1="1.5" x2="1920" y2="1.5" stroke="#00d9ff" stroke-width="3" opacity="0.9"/>
  <!-- Bottom border: 3px full-width -->
  <line x1="0" y1="84.5" x2="1920" y2="84.5" stroke="#00d9ff" stroke-width="3" opacity="0.7"/>

  <!-- LEFT ZONE: Branding -->
  <text x="24" y="38" font-family="monospace" font-size="22" font-weight="bold" fill="#00d9ff" opacity="1">CLON3D CYBERDECK OS</text>
  <text x="24" y="62" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.5">RETRO EMULATION TERMINAL</text>

  <!-- Left zone vertical separator -->
  <line x1="420" y1="8" x2="420" y2="78" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>

  <!-- CENTER ZONE: System select indicator frame -->
  <rect x="820" y="14" width="280" height="58" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
  <text x="960" y="40" font-family="monospace" font-size="12" fill="#00d9ff" opacity="0.7" text-anchor="middle">[ SYSTEM SELECT ]</text>
  <!-- LED indicator -->
  <line x1="880" y1="60" x2="944" y2="60" stroke="#00d9ff" stroke-width="1" opacity="0.35"/>
  <circle cx="960" cy="60" r="4" fill="#00d9ff" opacity="0.85"/>
  <line x1="976" y1="60" x2="1040" y2="60" stroke="#00d9ff" stroke-width="1" opacity="0.35"/>

  <!-- Right zone vertical separator -->
  <line x1="1500" y1="8" x2="1500" y2="78" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>

  <!-- RIGHT ZONE: Version and status -->
  <text x="1896" y="36" font-family="monospace" font-size="14" fill="#00d9ff" opacity="0.8" text-anchor="end">v4.0</text>
  <text x="1896" y="62" font-family="monospace" font-size="14" fill="#00d9ff" opacity="0.9" text-anchor="end">&#x25CF;ONLINE</text>
</svg>
