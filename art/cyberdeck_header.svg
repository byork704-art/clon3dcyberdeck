<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 200">
  <!-- Dark Background -->
  <rect width="1920" height="200" fill="#1a1a1e"/>
  
  <!-- Top Accent Line -->
  <rect width="1920" height="4" fill="#00d9ff" opacity="0.6"/>
  
  <!-- Header Text Background -->
  <rect x="50" y="30" width="1820" height="140" fill="none" stroke="#00d9ff" stroke-width="2" opacity="0.3"/>
  
  <!-- Corner Brackets -->
  <g stroke="#00d9ff" stroke-width="3" fill="none" opacity="0.7">
    <!-- Top Left -->
    <path d="M 70 50 L 70 70 L 90 70"/>
    <!-- Top Right -->
    <path d="M 1850 50 L 1850 70 L 1830 70"/>
    <!-- Bottom Left -->
    <path d="M 70 130 L 70 150 L 90 150"/>
    <!-- Bottom Right -->
    <path d="M 1850 130 L 1850 150 L 1830 150"/>
  </g>
  
  <!-- Decorative Side Elements -->
  <g fill="#00d9ff" opacity="0.4">
    <circle cx="120" cy="90" r="4"/>
    <circle cx="180" cy="90" r="4"/>
    <circle cx="1800" cy="90" r="4"/>
    <circle cx="1860" cy="90" r="4"/>
  </g>
  
  <!-- Bottom Accent Line -->
  <rect y="196" width="1920" height="4" fill="#00d9ff" opacity="0.6"/>
</svg>
