<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Dark Gunmetal Base -->
  <rect width="1920" height="1080" fill="#2a2a2e"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1e" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Subtle Horizontal Lines for Tech Feel -->
  <g stroke="#00d9ff" stroke-width="1" opacity="0.08">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
  </g>
</svg>
