<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- Radial Gradient for Cyan Glow -->
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.15" />
      <stop offset="50%" style="stop-color:#00d9ff;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#00d9ff;stop-opacity:0" />
    </radialGradient>
    
    <!-- Linear Gradient for Fade Effect -->
    <linearGradient id="fadeDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2e;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#2a2a2e;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#2a2a2e;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Main Glow Circle -->
  <circle cx="960" cy="540" r="700" fill="url(#cyberGlow)"/>
  
  <!-- Fade Overlay -->
  <rect width="1920" height="1080" fill="url(#fadeDark)"/>
  
  <!-- Subtle Scanline Effect -->
  <defs>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="1920" height="4">
      <line x1="0" y1="0" x2="1920" y2="0" stroke="#00d9ff" stroke-width="1" opacity="0.02"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#scanlines)"/>
</svg>
