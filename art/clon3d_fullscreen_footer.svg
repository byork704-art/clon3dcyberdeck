<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 130">
  <!-- Full-width bottom information footer -->
  
  <!-- Semi-transparent dark bar -->
  <rect width="1920" height="130" fill="#000000" opacity="0.8"/>
  
  <!-- Top bright accent line -->
  <rect width="1920" height="3" fill="#00d9ff" opacity="0.7"/>
  
  <!-- Left section: Controls -->
  <g>
    <text x="40" y="35" font-family="'Courier New', monospace" font-size="11" fill="#00d9ff" opacity="0.7" letter-spacing="1">CONTROLS</text>
    
    <g>
      <text x="40" y="65" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00d9ff">D-PAD:</text>
      <text x="160" y="65" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" opacity="0.7">SELECT SYSTEM</text>
    </g>
    
    <g>
      <text x="40" y="95" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00d9ff">A:</text>
      <text x="160" y="95" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" opacity="0.7">LAUNCH SYSTEM</text>
    </g>
  </g>
  
  <!-- Center section: System info -->
  <g text-anchor="middle">
    <text x="960" y="55" font-family="'Courier New', monospace" font-size="11" fill="#00d9ff" opacity="0.6">SYSTEM: --</text>
    <text x="960" y="80" font-family="'Courier New', monospace" font-size="11" fill="#00d9ff" opacity="0.6">GAMES: 0000 | FAVORITES: 00</text>
  </g>
  
  <!-- Right section: System operations -->
  <g text-anchor="end">
    <text x="1880" y="35" font-family="'Courier New', monospace" font-size="11" fill="#00d9ff" opacity="0.7" letter-spacing="1">SYSTEM</text>
    
    <g>
      <text x="1880" y="65" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00d9ff">B:</text>
      <text x="1760" y="65" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" opacity="0.7">BACK</text>
    </g>
    
    <g>
      <text x="1880" y="95" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00d9ff">START:</text>
      <text x="1760" y="95" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" opacity="0.7">OPTIONS</text>
    </g>
  </g>
  
  <!-- Bottom bright accent line -->
  <rect y="127" width="1920" height="3" fill="#00d9ff" opacity="0.9"/>
</svg>