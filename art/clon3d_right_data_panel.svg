<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 413 907">
  <!-- CLON3D CYBERDECK OS - Right Operational Data Panel -->
  <!-- Background -->
  <rect width="413" height="907" fill="#000000" opacity="0.60"/>
  <!-- Left-edge accent line -->
  <line x1="3" y1="0" x2="3" y2="907" stroke="#00d9ff" stroke-width="3" opacity="0.8"/>
  <!-- Border -->
  <rect x="5" y="1" width="407" height="905" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Corner brackets -->
  <g stroke="#00d9ff" stroke-width="2" fill="none" opacity="0.8">
    <!-- Top-left -->
    <polyline points="5,40 5,10 35,10"/>
    <!-- Top-right -->
    <polyline points="378,10 408,10 408,40"/>
    <!-- Bottom-left -->
    <polyline points="5,867 5,897 35,897"/>
    <!-- Bottom-right -->
    <polyline points="378,897 408,897 408,867"/>
  </g>

  <!-- === HEADER ZONE === -->
  <text x="209" y="42" font-family="monospace" font-size="14" font-weight="bold" fill="#00d9ff" opacity="1" text-anchor="middle">SYSTEM DATA</text>
  <!-- Header divider -->
  <line x1="16" y1="52" x2="397" y2="52" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>

  <!-- === SECTION 1: PLATFORM === -->
  <text x="20" y="80" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.7">PLATFORM</text>
  <text x="20" y="100" font-family="monospace" font-size="12" fill="#ffffff" opacity="0.7">&#x2014;&#x2014;</text>
  <!-- Section divider -->
  <line x1="16" y1="118" x2="397" y2="118" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>

  <!-- === SECTION 2: LIBRARY === -->
  <text x="20" y="140" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.7">LIBRARY</text>
  <text x="20" y="162" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.5">GAMES</text>
  <text x="393" y="162" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.7" text-anchor="end">&#x2014;&#x2014;</text>
  <text x="20" y="184" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.5">FAV</text>
  <text x="393" y="184" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.7" text-anchor="end">&#x2014;&#x2014;</text>
  <!-- Section divider -->
  <line x1="16" y1="200" x2="397" y2="200" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>

  <!-- === SECTION 3: LAST PLAYED === -->
  <text x="20" y="222" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.7">LAST PLAYED</text>
  <text x="20" y="244" font-family="monospace" font-size="12" fill="#ffffff" opacity="0.7">&#x2014;&#x2014;</text>
  <!-- Section divider -->
  <line x1="16" y1="262" x2="397" y2="262" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>

  <!-- === SECTION 4: CONTROLS === -->
  <text x="20" y="284" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.7">CONTROLS</text>
  <line x1="16" y1="294" x2="397" y2="294" stroke="#00d9ff" stroke-width="1" opacity="0.15"/>
  <text x="20" y="316" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.5">&#x2191;&#x2193;  NAVIGATE</text>
  <text x="20" y="338" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.5">&#x2190;&#x2192;  CYCLE</text>
  <text x="20" y="360" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.5">A    LAUNCH</text>
  <text x="20" y="382" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.5">B    BACK</text>
  <!-- Section divider -->
  <line x1="16" y1="398" x2="397" y2="398" stroke="#00d9ff" stroke-width="1" opacity="0.2"/>

  <!-- === SECTION 5: SYSTEM INFO (decorative) === -->
  <text x="20" y="420" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.7">SYSTEM INFO</text>
  <line x1="16" y1="430" x2="397" y2="430" stroke="#00d9ff" stroke-width="1" opacity="0.15"/>
  <text x="20" y="452" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.4">BUILD</text>
  <text x="393" y="452" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.5" text-anchor="end">v4.0</text>
  <text x="20" y="474" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.4">MODE</text>
  <text x="393" y="474" font-family="monospace" font-size="10" fill="#ffffff" opacity="0.5" text-anchor="end">ES</text>
  <text x="20" y="496" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.4">STATUS</text>
  <text x="393" y="496" font-family="monospace" font-size="10" fill="#00d9ff" opacity="0.8" text-anchor="end">&#x25CF;OK</text>
</svg>
