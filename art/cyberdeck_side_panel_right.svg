<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 800">
  <!-- Right side information panel -->
  
  <!-- Panel frame -->
  <rect x="10" y="10" width="260" height="780" fill="none" stroke="#00d9ff" stroke-width="2" opacity="0.6"/>
  <rect x="20" y="20" width="240" height="760" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
  
  <!-- Header divider -->
  <line x1="20" y1="70" x2="260" y2="70" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
  
  <!-- Title -->
  <text x="140" y="50" font-family="'Courier New', monospace" font-size="12" fill="#00d9ff" text-anchor="middle" font-weight="bold">QUICK ACCESS</text>
  
  <!-- Info blocks -->
  <g opacity="0.6">
    <!-- Block 1: Favorites -->
    <rect x="25" y="90" width="220" height="80" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
    <text x="35" y="110" font-family="'Courier New', monospace" font-size="10" fill="#00d9ff" opacity="0.8">FAVORITES</text>
    <text x="35" y="140" font-family="'Courier New', monospace" font-size="16" fill="#00d9ff" font-weight="bold">000</text>
    <text x="35" y="160" font-family="'Courier New', monospace" font-size="8" fill="#00d9ff" opacity="0.5">Saved Games</text>
  </g>
  
  <g opacity="0.6">
    <!-- Block 2: Recent -->
    <rect x="25" y="190" width="220" height="80" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
    <text x="35" y="210" font-family="'Courier New', monospace" font-size="10" fill="#00d9ff" opacity="0.8">RECENT</text>
    <text x="35" y="240" font-family="'Courier New', monospace" font-size="16" fill="#00d9ff" font-weight="bold">--:--</text>
    <text x="35" y="260" font-family="'Courier New', monospace" font-size="8" fill="#00d9ff" opacity="0.5">Last Played</text>
  </g>
  
  <g opacity="0.6">
    <!-- Block 3: Library -->
    <rect x="25" y="290" width="220" height="80" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.4"/>
    <text x="35" y="310" font-family="'Courier New', monospace" font-size="10" fill="#00d9ff" opacity="0.8">LIBRARY</text>
    <text x="35" y="340" font-family="'Courier New', monospace" font-size="16" fill="#00d9ff" font-weight="bold">00</text>
    <text x="35" y="360" font-family="'Courier New', monospace" font-size="8" fill="#00d9ff" opacity="0.5">Systems</text>
  </g>
  
  <!-- Divider -->
  <line x1="20" y1="400" x2="260" y2="400" stroke="#00d9ff" stroke-width="1" opacity="0.3"/>
  
  <!-- Bottom info -->
  <g opacity="0.4">
    <text x="140" y="450" font-family="'Courier New', monospace" font-size="9" fill="#00d9ff" text-anchor="middle">NAVIGATION</text>
    <text x="140" y="470" font-family="'Courier New', monospace" font-size="8" fill="#00d9ff" opacity="0.5" text-anchor="middle">USE DPAD/ARROWS</text>
  </g>
</svg>