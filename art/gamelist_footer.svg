<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 130">
  <!-- Game list view footer -->
  
  <!-- Dark background -->
  <rect width="1920" height="130" fill="#000000" opacity="0.8"/>
  
  <!-- Top accent line -->
  <rect width="1920" height="3" fill="#00d9ff" opacity="0.7"/>
  
  <!-- Left: Controls -->
  <g>
    <text x="40" y="35" font-family="'Courier New', monospace" font-size="11" fill="#00d9ff" opacity="0.7">CONTROLS</text>
    <text x="40" y="65" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00d9ff">UP/DOWN:</text>
    <text x="200" y="65" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" opacity="0.7">BROWSE GAMES</text>
    <text x="40" y="95" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00d9ff">A:</text>
    <text x="200" y="95" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" opacity="0.7">LAUNCH</text>
  </g>
  
  <!-- Center: Current selection info -->
  <text x="960" y="65" font-family="'Courier New', monospace" font-size="12" fill="#00d9ff" text-anchor="middle" opacity="0.6">GAME: --</text>
  
  <!-- Right: Additional commands -->
  <g text-anchor="end">
    <text x="1880" y="35" font-family="'Courier New', monospace" font-size="11" fill="#00d9ff" opacity="0.7">OPTIONS</text>
    <text x="1880" y="65" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00d9ff">B:</text>
    <text x="1720" y="65" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" opacity="0.7">BACK</text>
    <text x="1880" y="95" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00d9ff">Y:</text>
    <text x="1720" y="95" font-family="'Courier New', monospace" font-size="12" fill="#ffffff" opacity="0.7">FAVORITE</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect y="127" width="1920" height="3" fill="#00d9ff" opacity="0.9"/>
</svg>