<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 100">
  <!-- Dark footer background -->
  <rect width="1920" height="100" fill="#0d0d0f"/>
  
  <!-- Top bright line -->
  <rect width="1920" height="2" fill="#00d9ff" opacity="0.9"/>
  
  <!-- Left control hints -->
  <g opacity="0.6">
    <text x="40" y="35" font-family="Arial, sans-serif" font-size="12" fill="#00d9ff" font-weight="bold">◄ ► SELECT</text>
    <text x="40" y="70" font-family="Arial, sans-serif" font-size="11" fill="#00d9ff">Ⓐ LAUNCH</text>
  </g>
  
  <!-- Center copyright/info -->
  <g opacity="0.4" text-anchor="middle">
    <text x="960" y="50" font-family="Arial, sans-serif" font-size="10" fill="#00d9ff">RETRO GAMING SYSTEM • EMULATION PLATFORM</text>
  </g>
  
  <!-- Right control hints -->
  <g opacity="0.6" text-anchor="end">
    <text x="1880" y="35" font-family="Arial, sans-serif" font-size="12" fill="#00d9ff" font-weight="bold">MENU ☰</text>
    <text x="1880" y="70" font-family="Arial, sans-serif" font-size="11" fill="#00d9ff">Ⓒ BACK</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect y="98" width="1920" height="2" fill="#00d9ff" opacity="0.5"/>
</svg>