<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 120">
  <!-- Full-width top status bar (minimal, not prominent) -->
  
  <!-- Semi-transparent dark bar -->
  <rect width="1920" height="120" fill="#000000" opacity="0.7"/>
  
  <!-- Top bright accent line -->
  <rect width="1920" height="3" fill="#00d9ff" opacity="0.9"/>
  
  <!-- Left section: System identification -->
  <g>
    <text x="40" y="65" font-family="'Courier New', monospace" font-size="32" font-weight="bold" fill="#00d9ff" letter-spacing="2">CLON3D</text>
    <text x="40" y="105" font-family="'Courier New', monospace" font-size="12" fill="#00d9ff" opacity="0.6" letter-spacing="1">CYBERDECK TERMINAL</text>
  </g>
  
  <!-- Center section: System mode indicator -->
  <g text-anchor="middle">
    <rect x="850" y="20" width="220" height="80" fill="none" stroke="#00d9ff" stroke-width="1.5" opacity="0.5"/>
    <circle cx="920" cy="45" r="6" fill="none" stroke="#00d9ff" stroke-width="2" opacity="0.7"/>
    <circle cx="920" cy="45" r="3" fill="#00d9ff" opacity="0.9"/>
    <text x="920" y="75" font-family="'Courier New', monospace" font-size="14" fill="#00d9ff" font-weight="bold">SYSTEM MODE</text>
  </g>
  
  <!-- Right section: System version and status -->
  <g text-anchor="end">
    <text x="1880" y="50" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#00d9ff">v4.0</text>
    <text x="1880" y="105" font-family="'Courier New', monospace" font-size="11" fill="#00d9ff" opacity="0.6">OPERATING NORMAL</text>
  </g>
  
  <!-- Bottom bright accent line -->
  <rect y="117" width="1920" height="3" fill="#00d9ff" opacity="0.7"/>
</svg>