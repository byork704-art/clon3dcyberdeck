<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 150">
  <!-- Dark Background -->
  <rect width="1920" height="150" fill="#1a1a1e"/>
  
  <!-- Top Accent Line -->
  <rect y="0" width="1920" height="3" fill="#00d9ff" opacity="0.7"/>
  
  <!-- Center Divider -->
  <g stroke="#00d9ff" stroke-width="1" opacity="0.3">
    <line x1="960" y1="20" x2="960" y2="130"/>
  </g>
  
  <!-- Left Section -->
  <g stroke="#00d9ff" stroke-width="2" fill="none" opacity="0.4">
    <rect x="50" y="30" width="350" height="90"/>
  </g>
  
  <!-- Right Section -->
  <g stroke="#00d9ff" stroke-width="2" fill="none" opacity="0.4">
    <rect x="1520" y="30" width="350" height="90"/>
  </g>
  
  <!-- Decorative Dots -->
  <g fill="#00d9ff" opacity="0.5">
    <circle cx="100" cy="50" r="3"/>
    <circle cx="130" cy="50" r="3"/>
    <circle cx="160" cy="50" r="3"/>
    
    <circle cx="1820" cy="50" r="3"/>
    <circle cx="1850" cy="50" r="3"/>
    <circle cx="1880" cy="50" r="3"/>
  </g>
  
  <!-- Bottom Accent Line -->
  <rect y="147" width="1920" height="3" fill="#00d9ff" opacity="0.7"/>
</svg>
