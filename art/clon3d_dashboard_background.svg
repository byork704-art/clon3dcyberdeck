<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- Radial gradient: lighter center, darker edges -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1a1a1e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0e" stop-opacity="1"/>
    </radialGradient>
    <!-- Diagonal grid pattern at 45deg, 120px spacing -->
    <pattern id="diagGrid" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="120" y2="120" stroke="#00d9ff" stroke-width="0.8" opacity="0.03"/>
      <line x1="120" y1="0" x2="0" y2="120" stroke="#00d9ff" stroke-width="0.8" opacity="0.03"/>
      <line x1="-60" y1="60" x2="60" y2="-60" stroke="#00d9ff" stroke-width="0.8" opacity="0.03"/>
      <line x1="60" y1="180" x2="180" y2="60" stroke="#00d9ff" stroke-width="0.8" opacity="0.03"/>
    </pattern>
    <!-- Vignette overlay -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Diagonal grid overlay -->
  <rect width="1920" height="1080" fill="url(#diagGrid)"/>

  <!-- Vertical accent line: left column edge at x=268 -->
  <line x1="268" y1="0" x2="268" y2="1080" stroke="#00d9ff" stroke-width="2" opacity="0.15"/>

  <!-- Vertical accent line: right column edge at x=1507 -->
  <line x1="1507" y1="0" x2="1507" y2="1080" stroke="#00d9ff" stroke-width="2" opacity="0.15"/>

  <!-- Vignette overlay -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
