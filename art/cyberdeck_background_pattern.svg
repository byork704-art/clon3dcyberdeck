<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Full background tech pattern overlay -->
  
  <defs>
    <!-- Fine grid -->
    <pattern id="fine_grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#00d9ff" stroke-width="0.5" opacity="0.04"/>
    </pattern>
    
    <!-- Large grid -->
    <pattern id="large_grid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="none" stroke="#00d9ff" stroke-width="1" opacity="0.08"/>
    </pattern>
    
    <!-- Center focus gradient -->
    <radialGradient id="center_focus" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a1e;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Dark base -->
  <rect width="1920" height="1080" fill="#0a0a0e"/>
  
  <!-- Fine grid layer -->
  <rect width="1920" height="1080" fill="url(#fine_grid)"/>
  
  <!-- Large grid layer -->
  <rect width="1920" height="1080" fill="url(#large_grid)"/>
  
  <!-- Center focus area -->
  <rect width="1920" height="1080" fill="url(#center_focus)"/>
  
  <!-- Subtle vertical lines for depth -->
  <g stroke="#00d9ff" stroke-width="1" opacity="0.06">
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>
  
  <!-- Subtle horizontal lines for depth -->
  <g stroke="#00d9ff" stroke-width="1" opacity="0.04">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
  </g>
</svg>