  <!-- Dark background -->
  <rect width="1920" height="110" fill="#000000" opacity="0.8"/>
  
  <!-- Top accent line -->
  <rect width="1920" height="3" fill="#00d9ff" opacity="0.7"/>
  
  <!-- Left: Controls -->
  <g>
    <text x="40" y="30" font-family="'Courier New', monospace" font-size="11" fill="#00d9ff" opacity="0.7">CONTROLS</text>
